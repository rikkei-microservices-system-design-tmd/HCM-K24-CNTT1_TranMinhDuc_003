spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: category-service
              uri: lb://category-service
              predicates:
                - Path=/api/categories, /api/categories/**
            - id: medicine-service
              uri: lb://medicine-service
              predicates:
                - Path=/api/medicines, /api/medicines/**
      routes:
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories, /api/categories/**
        - id: medicine-service
          uri: lb://medicine-service
          predicates:
            - Path=/api/medicines, /api/medicines/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
